name: update

# Keeps every formula in Formula/ in step with its tool's releases. Each
# formula is regenerated from the release's Sigstore-verified checksums,
# installed and tested with Homebrew, and only then committed. No secrets are
# used: the job pushes to this repository with its own short-lived
# GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to update (default all)
        required: false
        type: choice
        options: [all, lockward, wardmap, dpdpward, peerward, appward, niyam, lineward, pramaan]
        default: all
      tag:
        description: Release tag to package (default the latest; only with a single formula)
        required: false

permissions:
  contents: read

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Regenerate the formulae (verifies each release signature)
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula || 'all' }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$FORMULA" = all ]; then
            if [ -n "$TAG" ]; then echo "::error::a tag needs a single formula"; exit 1; fi
            formulas="lockward wardmap dpdpward peerward appward niyam lineward pramaan"
          else
            formulas="$FORMULA"
          fi
          failed=""
          for f in $formulas; do
            # One tool's failure must not hold back the others; it still fails the job below.
            bin/update-formula.sh "$f" "$TAG" || { echo "::error::updating $f failed"; failed="$failed $f"; }
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Stop if nothing changed
        id: diff
        run: |
          # git status, not git diff: a first formula is an untracked new file.
          changed="$(git status --porcelain -- Formula | sed -n 's|.*Formula/\(.*\)\.rb$|\1|p' | tr '\n' ' ')"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formulae already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "formulas=$changed" >> "$GITHUB_OUTPUT"
            git add -N Formula && git diff -- Formula
          fi
      - name: Commit locally
        if: steps.diff.outputs.changed == 'true'
        env:
          FORMULAS: ${{ steps.diff.outputs.formulas }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $FORMULAS; do
            version="$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' "Formula/$f.rb" | head -1)"
            git add "Formula/$f.rb"
            git commit -m "$f ${version}"
          done
      - name: Install and test with Homebrew before publishing
        if: steps.diff.outputs.changed == 'true'
        env:
          FORMULAS: ${{ steps.diff.outputs.formulas }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap breaktroughf1/tap "$GITHUB_WORKSPACE"
          for f in $FORMULAS; do
            # Homebrew 6+ requires trust for non-official taps (docs.brew.sh/Tap-Trust).
            # Trust only this formula, never the whole tap.
            if brew trust --help >/dev/null 2>&1; then brew trust --formula "breaktroughf1/tap/$f"; fi
            brew audit --strict "breaktroughf1/tap/$f"
            brew install "breaktroughf1/tap/$f"
            brew test "breaktroughf1/tap/$f"
          done
      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Report failed updates
        if: always()
        run: |
          if [ -n "${FAILED:-}" ]; then echo "::error::formula updates failed for:${FAILED}"; exit 1; fi
